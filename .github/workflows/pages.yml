# Publishes mist.css to GitHub Pages on every push, so the @import
# updates within a minute or two. Pages lets browsers cache for only
# 10 minutes (jsDelivr allows 7 days).
#   main:    https://gbrouwerpower.github.io/jellyfin-mist-theme/mist.css
#   testing: https://gbrouwerpower.github.io/jellyfin-mist-theme/testing/mist.css
# Both files are rebuilt on every run, whichever branch was pushed, and
# committed to the gh-pages branch, which Pages serves. (Deploying the
# files directly names each deployment after the pushed commit, so after
# a fast-forward merge the second deploy was dropped as a duplicate.)
name: Publish to GitHub Pages

on:
  push:
    branches: [main, testing]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Collect each branch's mist.css
        run: |
          mkdir -p _site/testing
          git show origin/main:mist.css > _site/mist.css
          git show origin/testing:mist.css > _site/testing/mist.css
          touch _site/.nojekyll
      - name: Commit them to gh-pages
        working-directory: _site
        run: |
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Publish main $(git -C .. rev-parse --short origin/main) and testing $(git -C .. rev-parse --short origin/testing)"
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" gh-pages
